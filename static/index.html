<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск нор</title><link rel="stylesheet" href="/static/style.css?v=2"></head>
<body><main class="page">
<section class="intro">
<label class="upload" id="uploadLabel"><input type="file" id="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.avi,.mov" hidden><span class="plus">＋</span><span>Загрузить материал</span></label>
<div class="formats">Фото JPG, PNG, WebP · Видео MP4, AVI, MOV</div><p id="error" class="error" hidden></p>
</section>
<section class="model" id="modelBox" hidden><strong id="modelStatus"></strong><p>Для распознавания нужна готовая модель. Скачайте её или положите файл <b>best_epoch_weights.pth</b> в папку <b>model_data</b> и проверьте снова. Загруженный материал обработается автоматически, когда модель будет готова.</p><div class="actions"><button id="modelDownload">Скачать модель</button><button id="modelCheck" class="subtle">Проверить снова</button></div><small id="downloadProgress"></small></section>
<div class="screen" id="resultSection" hidden><img id="stream" alt="Фото или кадр видео с найденными норами"></div>
</main><script src="/static/app.js?v=2"></script></body></html>
